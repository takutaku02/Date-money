<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17151f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="デート割り勘アプリ">
  <meta name="mobile-web-app-capable" content="yes">
  <title>デート割り勘アプリ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <p class="eyebrow">OUR DATE EXPENSES</p>
      <h1>ふたりのデート代</h1>
      <p class="subtitle">支出を記録して、月ごとにすっきり精算</p>
    </header>

    <section class="month-nav card" aria-label="表示する月">
      <button type="button" id="previousMonth" class="icon-button" aria-label="前の月">‹</button>
      <label for="monthPicker" class="sr-only">表示する月</label>
      <input type="month" id="monthPicker">
      <button type="button" id="nextMonth" class="icon-button" aria-label="次の月">›</button>
    </section>

    <section class="summary card" aria-labelledby="summaryTitle">
      <div class="section-heading">
        <div>
          <p class="section-kicker">SUMMARY</p>
          <h2 id="summaryTitle">今月のまとめ</h2>
        </div>
        <span id="expenseCount" class="count-badge">0件</span>
      </div>

      <div class="summary-grid">
        <div class="summary-box total-box">
          <span>今月の合計</span>
          <strong id="total">¥0</strong>
        </div>
        <div class="summary-box">
          <span>自分が払った合計</span>
          <strong id="myTotal">¥0</strong>
        </div>
        <div class="summary-box">
          <span>相手が払った合計</span>
          <strong id="partnerTotal">¥0</strong>
        </div>
        <div class="summary-box summary-box-wide">
          <span>返済済み金額</span>
          <strong id="repaidTotal">¥0</strong>
        </div>
      </div>

      <div class="settlement">
        <span class="settlement-label">現在の未精算額</span>
        <strong id="settlementText">支出はまだありません</strong>
      </div>
    </section>

    <section class="form-area card" aria-labelledby="formTitle">
      <div class="section-heading">
        <div>
          <p class="section-kicker">NEW EXPENSE</p>
          <h2 id="formTitle">支出を追加</h2>
        </div>
      </div>

      <form id="expenseForm">
        <div class="form-grid">
          <div class="field date-field">
            <label for="date">日付</label>
            <input type="date" id="date" required>
          </div>
          <div class="field">
            <label for="payer">払った人</label>
            <select id="payer" required>
              <option value="自分">自分</option>
              <option value="相手">相手</option>
            </select>
          </div>
          <div class="field field-wide">
            <label for="title">内容</label>
            <input type="text" id="title" maxlength="50" placeholder="例：ランチ" required>
          </div>
          <div class="field field-wide">
            <label for="amount">金額</label>
            <div class="amount-input"><span>¥</span><input type="number" id="amount" min="1" step="1" inputmode="numeric" placeholder="3,000" required></div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="cancelButton" class="secondary-button" hidden>キャンセル</button>
          <button type="submit" id="addButton" class="primary-button">支出を追加</button>
        </div>
      </form>
    </section>

    <button type="button" id="showSettlementButton" class="settlement-trigger">＋ 精算を記録</button>

    <section id="settlementFormArea" class="settlement-form-area card" aria-labelledby="settlementFormTitle" hidden>
      <div class="section-heading">
        <div>
          <p class="section-kicker">SETTLEMENT</p>
          <h2 id="settlementFormTitle">精算を記録</h2>
        </div>
      </div>
      <form id="settlementForm">
        <div class="form-grid">
          <div class="field field-wide date-field">
            <label for="settlementDate">日付</label>
            <input type="date" id="settlementDate" required>
          </div>
          <div class="field field-wide">
            <label for="settlementDirection">誰から誰へ</label>
            <select id="settlementDirection" required>
              <option value="相手|自分">相手 → 自分</option>
              <option value="自分|相手">自分 → 相手</option>
            </select>
          </div>
          <div class="field field-wide">
            <label for="settlementAmount">返済した金額</label>
            <div class="amount-input"><span>¥</span><input type="number" id="settlementAmount" min="1" step="1" inputmode="numeric" placeholder="5,000" required></div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="cancelSettlementButton" class="secondary-button">キャンセル</button>
          <button type="submit" id="saveSettlementButton" class="primary-button">精算を保存</button>
        </div>
      </form>
    </section>

    <section class="history-area card" aria-labelledby="historyTitle">
      <div class="section-heading">
        <div>
          <p class="section-kicker">HISTORY</p>
          <h2 id="historyTitle">支出・精算履歴</h2>
        </div>
      </div>
      <div id="history" class="history-list"></div>
    </section>

    <section class="backup-area card" aria-labelledby="backupTitle">
      <div class="section-heading">
        <div>
          <p class="section-kicker">BACKUP</p>
          <h2 id="backupTitle">設定・バックアップ</h2>
        </div>
      </div>
      <p id="lastBackupAt" class="backup-status">最終バックアップ日時：未実施</p>
      <p class="backup-note">全期間の支出・精算データをJSONファイルに保存できます。</p>
      <div class="backup-actions">
        <button type="button" id="exportBackupButton" class="primary-button">バックアップを書き出す</button>
        <button type="button" id="importBackupButton" class="secondary-button">バックアップを読み込む</button>
        <input type="file" id="backupFileInput" accept="application/json,.json" class="sr-only">
      </div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
